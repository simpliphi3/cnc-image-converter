[project]
name = "cnc-image-converter"
version = "0.1.0"
description = "Local web app: GenAI image generation + image-to-STL conversion for Vectric Aspire CNC workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.55",
    "google-genai>=0.3",
    "pillow>=11.0",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "trimesh>=4.5",
    "potracer>=0.0.4",
    "torch>=2.4",
    "transformers>=4.46",
    "accelerate>=1.1",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
package = true
